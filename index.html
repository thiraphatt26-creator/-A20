<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {

            --bg: #dbeafe;
            --c: rgba(255, 255, 255, .75);
            --t: #12263f;
            --m: #64748b;
            --l: rgba(100, 130, 180, .18);
            --in: #fff;
            --fs-base: 14px;
            --fs-h2: 22px;
            --spacing-main: 22px;
        }
        [data-t=d] {

            --c: rgba(25, 40, 75, .85);
            --t: #e6eefc;
            --m: #9fb2d4;
            --l: rgba(255, 255, 255, .12);
            --in: #16264a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            font-family: Prompt, Sarabun, sans-serif;
            color: var(--t);
            font-size: var(--fs-base);
            min-height: 100vh;
            background: radial-gradient(at 0 0, #a9d4ff, transparent 50%), radial-gradient(at 100% 100%, #b9c8ff, transparent 50%), var(--bg);
            background-attachment: fixed;
        }
        .lay {
            display: flex;
            min-height: 100vh;
        }
        .side {
            width: 240px;
            background: linear-gradient(180deg, #0b3a8f, #1558d6);
            color: #fff;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto;
            flex-shrink: 0;

        .pf {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, .12);
            border-radius: 14px;

            display: block;
            opacity: .75;
            font-size: 0.85em;

        .av {

            height: 40px;
            border-radius: 50%;
            background: #fff;
            color: #1558d6;
            display: grid;
            place-items: center;
            font-weight: 600;
            font-size: 18px;
            flex-shrink: 0;

        .nv {
            background: none;
            border: 0;
            color: #fff;
            text-align: left;
            padding: 11px 14px;
            border-radius: 12px;
            font: inherit;
            cursor: pointer;
            opacity: .85;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;

        .nv:hover {
            background: rgba(255, 255, 255, .15);
        }
        .nv.on {
            background: linear-gradient(135deg, #38d6ff, #1a6df0);
            color: #fff;
            font-weight: 500;
            opacity: 1;
            box-shadow: 0 0 16px rgba(56, 214, 255, .45);

        main {
            flex: 1;
            padding: var(--spacing-main);
            min-width: 0;
        }
        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h2 { font-size: var(--fs-h2); }
        h3 { margin-bottom: 10px; font-size: 1.15rem; }
        .card {
            background: var(--c);

            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 8px 28px rgba(30, 80, 170, .1);

        .tw { overflow-x: auto; }
        .grid {

            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .gr2 {

        .gr2 .card { margin: 0; }
        .sc {
            background: var(--c);
            border: 1px solid var(--l);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            border-left: 4px solid #38d6ff;

        .sc b {
            font-size: 2rem;
            display: block;
            color: var(--p);

        .sc span { color: var(--m); font-size: 0.9rem; }
        .b {

            border-radius: 999px;
            font: inherit;
            cursor: pointer;

            justify-content: center;
            gap: 6px;

            color: var(--m);

        .r2, .r3, .r4 {

            gap: 12px;

        .r3 { grid-template-columns: 2fr 1fr; }
        .r4 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
        table { width: 100%; border-collapse: collapse; }
        th, td {

            border-radius: 50%;

            place-items: center;
            margin: auto;

        .ring b {
            background: var(--bg);

            font-size: 1.3rem;

        .two {

        .mo {

            inset: 0;
            background: rgba(10, 25, 60, .45);

            color: var(--t);

            bottom: 24px;
            left: 50%;

            color: #fff;
            padding: 10px 22px;

            font-size: 0.95rem;

        .au {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            align-items: center;
        }
        .hero {
            padding: 60px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #0a3a95, #1a6df0 60%, #38bdf8);

        .hero p { font-size: 1.05rem; opacity: .9; line-height: 1.7; }
        .lg { font-size: 4rem; }

            width: calc(100% - 32px);

        .form .b { width: 100%; margin-top: 8px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tabs .b { margin: 0; }
        
        #pr { display: none; }
 
        @media(max-width: 1024px) {

                --fs-base: 13.5px;
                --fs-h2: 20px;
                --spacing-main: 16px;
            }
            .side { width: 210px; }

                --fs-base: 13px;
                --fs-h2: 18px;

            .hero p { font-size: 0.95rem; }
            .lg { font-size: 3rem; }

            .card { padding: 14px; border-radius: 16px; }

            .ar .b { flex: 1; justify-content: center; }
        }

            .grid { grid-template-columns: 1fr; }
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: linear-gradient(rgba(26, 109, 240, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(26, 109, 240, .06) 1px, transparent 1px);

            background: linear-gradient(200deg, #050f33, #0b3a9c 60%, #1b6df0);

        function parseTextExam() {
            const raw = $('#import_text').value.trim();
            if (!raw) return toast('วางข้อความข้อสอบก่อน');
            const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
            let currentQ = null, questions = [];
 
            lines.forEach(line => {
                if (/^\d+[\.\)]/.test(line) || !currentQ) {
                    if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);
                    currentQ = { q: line.replace(/^\d+[\.\)]\s*/, ''), c: [], a: 0, p: 1 };
                } else if (/^[ก-งa-dA-D][\.\)]/.test(line)) {
                    let text = line.replace(/^[ก-งa-dA-D][\.\)]\s*/, '');
                    if (text.endsWith('*')) {
                        text = text.slice(0, -1);
                        currentQ.a = currentQ.c.length;
                    }
                    currentQ.c.push(text);
                }
            });
            if (currentQ && currentQ.c.length >= 2) questions.push(currentQ);
 
            if (!questions.length) return toast('รูปแบบข้อความไม่ถูกต้อง');
            questions.forEach(q => $('#qs').insertAdjacentHTML('beforeend', qb(q)));
            toast(`นำเข้าข้อสอบสำเร็จ ${questions.length} ข้อ`);
            $('#import_text').value = '';
        }

                    if (Array.isArray(data)) {

                }
            };
            reader.readAsText(file);
        }
